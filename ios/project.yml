# Xcode projesi bu dosyadan üretilir (xcodeproj git'e girmez):
#   brew install xcodegen && cd ios && xcodegen
name: PatiHarita

options:
  bundleIdPrefix: app.patiharita
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: tr
  createIntermediateGroups: true

configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  AnimalKit:
    path: Packages/AnimalKit
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    from: "11.0.0"
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"

targets:
  PatiHarita:
    type: application
    platform: iOS
    sources:
      - path: PatiHarita
    fileGroups:
      - Config
      - Kadikoy.gpx
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.patiharita.ios
        INFOPLIST_FILE: PatiHarita/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        # Firebase SPM kurulum yönergesi.
        OTHER_LDFLAGS: ["$(inherited)", "-ObjC"]
    dependencies:
      - package: AnimalKit
      - package: GoogleMaps
        product: GoogleMaps
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAppCheck

schemes:
  PatiHarita:
    build:
      targets:
        PatiHarita: all
    run:
      config: Debug
      # Xcode → Edit Scheme → Arguments'tan açılıp kapatılabilir.
      commandLineArguments:
        "-demo": false
        "-useEmulator": false
      simulateLocation:
        allow: true
        defaultLocation: Kadikoy.gpx
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - package: AnimalKit/AnimalKitTests
    archive:
      config: Release

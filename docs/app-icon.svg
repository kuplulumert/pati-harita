<!-- Uygulama simgesinin kaynağı. PNG (1024x1024, alfa kanalı yok): ios/PatiHarita/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7EC"/>
      <stop offset="1" stop-color="#FBDDBF"/>
    </linearGradient>
    <linearGradient id="pin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FF8F3F"/>
      <stop offset="1" stop-color="#E8432D"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#7A2E12" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- harita sokakları -->
  <g stroke="#FFFFFF" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M-60 790 L1090 320" stroke-width="64"/>
    <path d="M190 -60 L360 1090" stroke-width="46"/>
    <path d="M760 -60 C 700 260, 900 560, 1090 640" stroke-width="38"/>
  </g>
  <ellipse cx="840" cy="880" rx="190" ry="130" fill="#CFE6C4" opacity="0.9"/>

  <!-- iğnenin gölgesi -->
  <ellipse cx="512" cy="912" rx="130" ry="30" fill="#7A2E12" opacity="0.18"/>

  <!-- iğne -->
  <path d="M512 900 L290.9 585 A270 270 0 1 1 733.1 585 Z"
        fill="url(#pin)" stroke="#FFFFFF" stroke-width="30" stroke-linejoin="round" filter="url(#soft)"/>

  <!-- pati -->
  <g fill="#FFFFFF">
    <ellipse cx="512" cy="492" rx="104" ry="86"/>
    <ellipse cx="392" cy="396" rx="44" ry="58" transform="rotate(-26 392 396)"/>
    <ellipse cx="460" cy="324" rx="44" ry="60" transform="rotate(-10 460 324)"/>
    <ellipse cx="564" cy="324" rx="44" ry="60" transform="rotate(10 564 324)"/>
    <ellipse cx="632" cy="396" rx="44" ry="58" transform="rotate(26 632 396)"/>
  </g>
</svg>

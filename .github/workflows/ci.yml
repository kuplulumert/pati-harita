name: CI

# Her iş yalnızca kendi dosyaları değişince çalışır (depo açık olduğu için dakika ücretsiz, ama beklemeye
# ve boşa çalışmaya gerek yok). Hepsini elle çalıştırmak için: gh workflow run ci.yml --ref <dal>
on:
  # Yalnızca dallar: v* etiketleri TestFlight içindir (Codemagic), aynı commit burada zaten test edildi.
  push:
    branches: ["**"]
  workflow_dispatch:

# Aynı dala yeni commit gelince yarım kalan eski çalışma iptal edilir.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Değişen bölümler
    runs-on: ubuntu-latest
    outputs:
      firebase: ${{ steps.filter.outputs.firebase }}
      animalkit: ${{ steps.filter.outputs.animalkit }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            firebase:
              - 'firebase/**'
              - 'shared/**'
              - 'prototype/firebase-kurulum.html'
              - '.github/workflows/ci.yml'
            animalkit:
              - 'ios/Packages/AnimalKit/**'
              - 'shared/**'
              - '.github/workflows/ci.yml'
            ios:
              - 'ios/**'
              - 'shared/**'

  firebase:
    name: Firebase kuralları ve fonksiyonlar
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.firebase == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            firebase/package-lock.json
            firebase/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Bağımlılıklar
        run: |
          npm ci --prefix firebase
          npm ci --prefix firebase/functions
      - name: Fonksiyonlar tip kontrolü
        run: npm run typecheck --prefix firebase/functions
      - name: Testler (Firestore emülatörü)
        working-directory: firebase
        run: npm test

  # Saf Swift (yalnızca Foundation): Linux'ta daha hızlı başlar. iOS'a özgü kod uygulama işinde derlenir.
  animalkit:
    name: AnimalKit (Swift, Linux)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.animalkit == 'true'
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: ios/Packages/AnimalKit
        run: swift test

  # Mac olmadan deneme: Release simülatör paketi (Appetize.io vb. tarayıcı simülatörlerine yüklenir)
  # ve uygulamanın simülatörde açılıp çökmediğini gösteren ekran görüntüsü.
  ios-app:
    name: iOS uygulaması derlemesi
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # Firebase SPM paketlerini her seferinde yeniden indirmemek için.
      - uses: actions/cache@v4
        with:
          path: ios/build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/project.yml') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Xcode projesini üret
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen
      - name: Derle (simülatör, imzasız)
        working-directory: ios
        run: |
          xcodebuild build \
            -project PatiHarita.xcodeproj \
            -scheme PatiHarita \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO
      # Gizlilik bildirimi pakete girmezse App Store Connect yüklemeyi reddeder; derlemede kimse fark etmez.
      - name: Gizlilik bildirimi pakette mi
        working-directory: ios/build/Build/Products/Release-iphonesimulator
        run: |
          MANIFEST=PatiHarita.app/PrivacyInfo.xcprivacy
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::PrivacyInfo.xcprivacy uygulama paketinde yok (ios/PatiHarita altında olmalı, Copy Bundle Resources'a girmeli)."
            exit 1
          fi
          if ! plutil -lint "$MANIFEST"; then
            echo "::error::PrivacyInfo.xcprivacy geçerli bir plist değil."
            exit 1
          fi
      - name: Simülatör paketi
        working-directory: ios/build/Build/Products/Release-iphonesimulator
        run: |
          lipo -info PatiHarita.app/PatiHarita
          ditto -c -k --sequesterRsrc --keepParent PatiHarita.app "$GITHUB_WORKSPACE/PatiHarita-simulator.zip"
          du -h "$GITHUB_WORKSPACE/PatiHarita-simulator.zip"
      - name: Simülatörde aç, ekran görüntüsü al
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(p) for p in runtime.rsplit(".", 1)[-1].split("-")[1:]]
          runtimes = sorted((r for r in devices if ".iOS-" in r), key=version, reverse=True)
          print(next(d["udid"] for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")))
          ')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 || true
          xcrun simctl install "$UDID" ios/build/Build/Products/Release-iphonesimulator/PatiHarita.app
          # Konum izni önceden verilir; konum Kadıköy (ios/Kadikoy.gpx ile aynı).
          xcrun simctl privacy "$UDID" grant location app.patiharita.ios
          xcrun simctl location "$UDID" set 40.9903,29.0290
          xcrun simctl launch "$UDID" app.patiharita.ios
          sleep 20
          mkdir -p smoke
          xcrun simctl io "$UDID" screenshot smoke/acilis.png
          xcrun simctl spawn "$UDID" log show --last 3m --style compact \
            --predicate 'process == "PatiHarita"' > smoke/log.txt || true
          # Çıktı önce değişkene alınır: `launchctl list | grep -q` ilk eşleşmede kapanınca launchctl
          # SIGPIPE alıyor ve pipefail yüzünden çalışan uygulama "çöktü" sayılıyordu.
          RUNNING=$(xcrun simctl spawn "$UDID" launchctl list)
          if ! grep -q app.patiharita.ios <<< "$RUNNING"; then
            echo "::error::Uygulama açıldıktan sonra kapandı (çökme). Ayrıntı: smoke/log.txt"
            tail -50 smoke/log.txt
            exit 1
          fi
      - name: Arayüz testi (demo akışı, adım adım ekran görüntüsü)
        working-directory: ios
        env:
          # TEST_RUNNER_ önekli değişkenler test sürecine öneksiz geçer (SCREENSHOT_DIR).
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/smoke/ui
        run: |
          set -o pipefail
          # Aynı ayarlar: derleme adımının çıktısı yeniden kullanılır, yalnızca test hedefi derlenir.
          xcodebuild test \
            -project PatiHarita.xcodeproj \
            -scheme PatiHarita \
            -configuration Release \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath build \
            -resultBundlePath "$GITHUB_WORKSPACE/UITests.xcresult" \
            -only-testing:PatiHaritaUITests \
            -enableCodeCoverage NO \
            -skipPackagePluginValidation \
            ONLY_ACTIVE_ARCH=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PatiHarita-simulator
          path: PatiHarita-simulator.zip
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshot
          path: smoke/
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ui-test-result
          path: UITests.xcresult
          if-no-files-found: ignore
          retention-days: 14
